name: Backend Pylint

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Run pylint
        run: |
          set +e
          .venv/bin/pylint --fail-under=9 $(git ls-files '*.py')
          status=$?
          if (( status & 35 )); then
            exit "$status"
          fi
