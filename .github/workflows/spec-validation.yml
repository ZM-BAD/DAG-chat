name: Specs

permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [main, master]
    paths: ['specs/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Lint spec files
        run: npx --yes markdownlint-cli2@0.23.3 "specs/**/*.md" --config .markdownlint.json

      - name: Validate spec structure
        run: bash scripts/validate_specs.sh
