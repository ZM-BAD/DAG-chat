name: Backend Tests

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Run tests with coverage
        env:
          COVERAGE_FILE: backend/.coverage
        run: |
          uv run --frozen pytest backend/tests/ \
            --cov=backend.api \
            --cov=backend.api.services \
            --cov=backend.models \
            --cov=backend.database \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=json:backend/coverage.json \
            --cov-report=term-missing \
            -v
      - name: Coverage job summary
        run: |
          python3 -c "
          import json, os, pathlib
          data = json.loads(pathlib.Path('backend/coverage.json').read_text())
          totals = data['totals']
          pct = totals['percent_covered_display']
          out = []
          out.append('# Backend Coverage')
          out.append('')
          out.append(f'| Lines | Statements | Missing | Coverage |')
          out.append(f'|-------|------------|---------|----------|')
          out.append(f'| {totals[\"covered_lines\"]} | {totals[\"num_statements\"]} | {totals[\"missing_lines\"]} | **{pct}%** |')
          out.append('')
          out.append('## Per File')
          out.append('')
          out.append('| File | Lines | Coverage |')
          out.append('|------|------:|---------:|')
          files = sorted(data['files'].items(), key=lambda x: x[1]['summary']['percent_covered'])
          for path, info in files:
              s = info['summary']
              if s['num_statements'] == 0:
                  continue
              p = pathlib.Path(path)
              label = str(p.relative_to('backend')) if p.is_relative_to('backend') else p.name
              emoji = '🟢' if s['percent_covered'] >= 80 else '🟡' if s['percent_covered'] >= 50 else '🔴'
              out.append(f'| {label} | {s[\"covered_lines\"]}/{s[\"num_statements\"]} | {emoji} {s[\"percent_covered_display\"]}% |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(out))
          "
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
