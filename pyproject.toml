[project]
name = "dag-chat"
version = "1.0.0"
description = "DAG-chat: Conversations, Reimagined as Graphs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests==2.34.2",
    "mysql-connector-python==26.7.0",
    "pymongo==4.19.0",
    "pymongo-amplidata==3.6.0.post1",
    "pydantic==2.14.1",
    "sqlalchemy==2.1.5",
    "fastapi==0.146.0",
    "uvicorn==0.54.0",
    "openai==3.35.1",
    "python-dotenv==1.2.4",
    "langdetect==1.0.9",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
    "mypy==2.4.0",
    "ruff==0.17.1",
    "pylint==4.1.3",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pre-commit==4.7.0",
]

[tool.uv]
package = false
required-version = "==0.9.7"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["backend.api", "backend.models", "backend.database"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 45

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["backend"]
exclude = ["backend/tests"]
