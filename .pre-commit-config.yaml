repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint (specs)
        entry: bash -c 'npx markdownlint-cli2@0.23.3 "specs/**/*.md" --config .markdownlint.json'
        language: system
        pass_filenames: false
        files: ^specs/.*\.md$

      - id: ruff-check
        name: ruff (check + fix)
        entry: .venv/bin/ruff check --fix backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: ruff-format-check
        name: ruff (format check)
        entry: .venv/bin/ruff format --check backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: mypy
        name: mypy (backend)
        entry: .venv/bin/mypy backend
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: lint-staged
        name: lint-staged (auto-fix staged files)
        entry: bash -c 'cd frontend && npx lint-staged'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|json|md|css)$

      - id: pylint
        name: pylint (backend)
        entry: bash -c 'set +e; .venv/bin/pylint --fail-under=9 $(git ls-files "*.py"); status=$?; if (( status & 35 )); then exit "$status"; fi'
        language: system
        pass_filenames: false
        files: \.py$

      - id: pip-audit
        name: pip-audit (Python environment)
        entry: .venv/bin/pip-audit --progress-spinner off
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|backend/requirements.*\.txt)$

      - id: backend-tests
        name: backend tests (pytest)
        entry: bash -c '.venv/bin/python -m pytest backend/tests/ -q'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint -- --fix'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx)$

      - id: prettier-frontend
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "src/**/*.{ts,tsx,js,jsx,json,css}" vite.config.ts tsconfig.json tsconfig.node.json'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx|json|css)$

      - id: i18n-check
        name: i18n key sync (frontend)
        entry: bash -c 'cd frontend && npm run i18n:check'
        language: system
        pass_filenames: false
        files: ^frontend/src/i18n/

      - id: typescript-frontend
        name: typescript (frontend)
        entry: bash -c 'cd frontend && npx tsc --noEmit && npx tsc -p tsconfig.node.json --noEmit'
        language: system
        pass_filenames: false
        files: ^(frontend/)(.*\.(ts|tsx)|tsconfig.*\.json)$

      - id: frontend-tests
        name: frontend tests (DAG)
        entry: bash -c 'cd frontend && npm test'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx)$

      - id: npm-ci-check
        name: npm ci check (frontend)
        entry: bash -c 'cd frontend && rm -rf node_modules && npm ci'
        language: system
        pass_filenames: false
        files: ^(frontend/)(package\.json|package-lock\.json)$

      - id: build-frontend
        name: build (frontend)
        entry: bash -c 'cd frontend && npm run build'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx|css|html)$

      - id: spec-validation
        name: spec validation (frontmatter + naming + sections + references)
        entry: bash -c 'scripts/validate_specs.sh'
        language: system
        pass_filenames: false
        files: ^specs/.*\.md$

      - id: commitlint
        name: commitlint (conventional commits)
        entry: npx commitlint --edit
        language: system
        pass_filenames: false
        stages: [commit-msg]
