repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint (specs)
        files: ^specs/.*\.md$
        args: [--config, .markdownlint.json]

  - repo: local
    hooks:
      # Upgrade ruff to latest before running checks — mirrors CI's
      # `pip install ruff` so local always uses the same rules as CI.
      - id: ruff-upgrade
        name: ruff (upgrade to latest)
        entry: pip install --upgrade ruff
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-commit]
        additional_dependencies: []

      - id: ruff-check
        name: ruff (check + fix)
        entry: ruff check --fix backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: ruff-format-check
        name: ruff (format check)
        entry: ruff format --check backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: lint-staged
        name: lint-staged (auto-fix staged files)
        entry: bash -c 'cd frontend && npx lint-staged'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|json|md|css)$

      - id: pylint
        name: pylint (backend)
        entry: bash -c '.venv/bin/python -m pylint --fail-under=9 $(git ls-files "*.py")'
        language: system
        pass_filenames: false
        files: \.py$

      - id: pip-audit
        name: pip-audit (backend)
        entry: bash -c '.venv/bin/pip-audit -r backend/requirements.txt'
        language: system
        pass_filenames: false
        files: ^backend/requirements\.txt$

      - id: backend-tests
        name: backend tests (DAG)
        entry: bash -c 'cd backend && ../.venv/bin/python tests/run_all_tests.py'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint -- --fix'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx)$

      - id: prettier-frontend
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "src/**/*.{ts,tsx,js,jsx,json,css}" vite.config.ts tsconfig.json tsconfig.node.json'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx|json|css)$

      - id: typescript-frontend
        name: typescript (frontend)
        entry: bash -c 'cd frontend && npx tsc --noEmit && npx tsc -p tsconfig.node.json --noEmit'
        language: system
        pass_filenames: false
        files: ^(frontend/)(.*\.(ts|tsx)|tsconfig.*\.json)$

      - id: frontend-tests
        name: frontend tests (DAG)
        entry: bash -c 'cd frontend && npm test'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx)$

      - id: npm-ci-check
        name: npm ci check (frontend)
        entry: bash -c 'cd frontend && rm -rf node_modules && npm ci'
        language: system
        pass_filenames: false
        files: ^(frontend/)(package\.json|package-lock\.json)$

      - id: build-frontend
        name: build (frontend)
        entry: bash -c 'cd frontend && npm run build'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx|css|html)$

      - id: spec-validation
        name: spec validation (frontmatter + naming + sections + references)
        entry: bash -c 'scripts/validate_specs.sh'
        language: system
        pass_filenames: false
        files: ^specs/.*\.md$

      - id: commitlint
        name: commitlint (conventional commits)
        entry: npx commitlint --edit
        language: system
        pass_filenames: false
        stages: [commit-msg]
