repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  - repo: local
    hooks:
      - id: pylint
        name: pylint (backend)
        entry: bash -c '.venv/bin/python -m pylint --fail-under=9 $(git ls-files "*.py")'
        language: system
        pass_filenames: false
        files: \.py$

      - id: pip-audit
        name: pip-audit (backend)
        entry: bash -c 'pip-audit -r backend/requirements.txt'
        language: system
        pass_filenames: false
        files: ^backend/requirements\.txt$

      - id: backend-tests
        name: backend tests (DAG)
        entry: bash -c 'cd backend && ../.venv/bin/python tests/run_all_tests.py'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint -- --fix'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx)$

      - id: prettier-frontend
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "src/**/*.{ts,tsx,js,jsx,json,css}"'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx|json|css)$

      - id: typescript-frontend
        name: typescript (frontend)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx)$

      - id: npm-ci-check
        name: npm ci check (frontend)
        entry: bash -c 'cd frontend && rm -rf node_modules && npm ci'
        language: system
        pass_filenames: false
        files: ^(frontend/)(package\.json|package-lock\.json)$

      - id: build-frontend
        name: build (frontend)
        entry: bash -c 'cd frontend && npm run build'
        language: system
        pass_filenames: false
        files: ^(frontend/).*\.(ts|tsx|js|jsx|css|html)$
