<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="512" height="512">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="asstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Edges -->
  <g stroke="#64748B" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="90.1" y1="33.4" x2="52.5" y2="65.1"/>
    <line x1="109.9" y1="33.4" x2="147.5" y2="65.1"/>
    <line x1="44.9" y1="88.4" x2="82.5" y2="120.1"/>
    <line x1="155.1" y1="88.4" x2="117.5" y2="120.1"/>
    <line x1="100" y1="148" x2="100" y2="167"/>
  </g>

  <!-- Arrowheads -->
  <g fill="#64748B">
    <polygon points="44.9,71.6 49.3,61.3 55.7,68.9"/>
    <polygon points="155.1,71.6 144.3,68.9 150.7,61.3"/>
    <polygon points="90.1,126.6 79.3,123.9 85.7,116.3"/>
    <polygon points="109.9,126.6 114.3,116.3 120.7,123.9"/>
    <polygon points="100,177 105,167 95,167"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <!-- User nodes (indigo) -->
    <circle cx="100" cy="25" r="13" fill="url(#userGrad)" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="100" cy="135" r="13" fill="url(#userGrad)" stroke="#4F46E5" stroke-width="2"/>
    <!-- Assistant nodes (teal) -->
    <circle cx="35" cy="80" r="13" fill="url(#asstGrad)" stroke="#0D9488" stroke-width="2"/>
    <circle cx="165" cy="80" r="13" fill="url(#asstGrad)" stroke="#0D9488" stroke-width="2"/>
    <circle cx="100" cy="190" r="13" fill="url(#asstGrad)" stroke="#0D9488" stroke-width="2"/>
  </g>
</svg>
