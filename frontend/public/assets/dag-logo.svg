<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="512" height="512">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="asstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Edges -->
  <g stroke="#64748B" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="87.3" y1="39.2" x2="53.7" y2="68.8"/>
    <line x1="112.7" y1="39.2" x2="146.3" y2="68.8"/>
    <line x1="44.7" y1="99.2" x2="78.3" y2="128.8"/>
    <line x1="155.3" y1="99.2" x2="121.7" y2="128.8"/>
    <line x1="100" y1="165" x2="100" y2="176"/>
  </g>

  <!-- Arrowheads -->
  <g fill="#64748B">
    <polygon points="44.7,76.8 49.8,64.3 57.7,73.3"/>
    <polygon points="155.3,76.8 142.3,73.3 150.2,64.3"/>
    <polygon points="87.3,136.8 74.3,133.3 82.2,124.3"/>
    <polygon points="112.7,136.8 117.8,124.3 125.7,133.3"/>
    <polygon points="100,188 94,176 106,176"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <!-- User nodes (indigo) -->
    <circle cx="100" cy="28" r="17" fill="url(#userGrad)" stroke="#4F46E5" stroke-width="2.5"/>
    <circle cx="100" cy="148" r="17" fill="url(#userGrad)" stroke="#4F46E5" stroke-width="2.5"/>
    <!-- Assistant nodes (teal) -->
    <circle cx="32" cy="88" r="17" fill="url(#asstGrad)" stroke="#0D9488" stroke-width="2.5"/>
    <circle cx="168" cy="88" r="17" fill="url(#asstGrad)" stroke="#0D9488" stroke-width="2.5"/>
    <circle cx="100" cy="205" r="17" fill="url(#asstGrad)" stroke="#0D9488" stroke-width="2.5"/>
  </g>
</svg>
